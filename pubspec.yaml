name: top_places
description: "The best places to eat and drink in Romania, with a map, reviews and an assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  intl: ^0.20.3
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  go_router: ^17.5.0
  http: ^1.6.0
  supabase_flutter: ^2.18.0
  geolocator: ^14.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # The texts in lib/l10n, see l10n.yaml.
  generate: true
  assets:
    - assets/data/
    - assets/images/
